---
layout: default
---
<div class="section">
  <h2>Problem</h2>
  <div class="problem-statement">
    {{ page.problem | markdownify }}
  </div>
</div>

<div class="section">
  <h2>Solution</h2>
  <div class="code-actions">
    <button id="copy-solution" class="button" type="button">Copy</button>
    <a id="open-raw" class="button" target="_blank" rel="noopener">Open Raw</a>
  </div>
  <pre><code id="solution-code">Loading solution from src: {{ page.solution_path }}</code></pre>
</div>

<div class="section">
  <h2>Explanation</h2>
  <div class="explanation">
    {{ page.explanation | markdownify }}
  </div>
</div>

<script>
(function(){
  var path = {{ page.solution_path | jsonify }};
  if(!path){ return; }
  var nwo = {{ site.github.repository_nwo | jsonify }};
  var sha = {{ site.github.build_revision | jsonify }};
  var branch = sha || 'main';
  var raw = 'https://raw.githubusercontent.com/' + nwo + '/' + branch + '/' + path.replace(/^\/+/, '');

  var codeEl = document.getElementById('solution-code');
  var openRaw = document.getElementById('open-raw');
  var copyBtn = document.getElementById('copy-solution');

  openRaw.href = raw;

  fetch(raw, { cache: 'no-cache' })
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(txt){ codeEl.textContent = txt; })
    .catch(function(err){ codeEl.textContent = 'Failed to load solution from: ' + raw + '\n' + err; });

  copyBtn.addEventListener('click', function(){
    var text = codeEl.textContent || '';
    navigator.clipboard.writeText(text).then(function(){
      copyBtn.textContent = 'Copied!';
      setTimeout(function(){ copyBtn.textContent = 'Copy'; }, 1200);
    });
  });
})();
</script>
